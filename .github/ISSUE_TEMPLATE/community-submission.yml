name: Community submission
description: Submit an original lyric, melody, beat, vocal demo, or developer contribution.
title: "[Submission]: "
body:
  - type: markdown
    attributes:
      value: |
        Do not submit private, unreleased master files, credentials, or material without permission.
  - type: input
    id: contributor
    attributes:
      label: Contributor name or handle
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Contribution type
      options:
        - Written lyrics
        - Raw melody
        - Music beat
        - Vocal demo
        - Developer tool
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description and source
      description: Explain the work, source, and collaborators.
    validations:
      required: true
  - type: textarea
    id: rights
    attributes:
      label: Rights and license
      description: State ownership, permission, or license and any restrictions.
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I have the right to share this material and accept human review.
          required: true
        - label: I did not include secrets, private data, or unreleased masters.
          required: true
